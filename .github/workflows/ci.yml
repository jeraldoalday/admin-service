name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One script, so the pass that has to succeed here is the same one you can run before
      # pushing: lint, formatting, types, and the suite under its coverage thresholds.
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
